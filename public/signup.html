<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account · Outreach</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Outreach</h1>
      <p class="subtitle">Create your account</p>
      <form id="signupForm">
        <label>Email<input type="email" id="email" autocomplete="username" required /></label>
        <label>Password (min 8 characters)<input type="password" id="password" autocomplete="new-password" required /></label>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>
      <div id="msg" class="auth-msg"></div>
      <div class="auth-links">
        <a href="login.html">Already have an account? Sign in</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { api } from './js/api.js';
    const msg = document.getElementById('msg');
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'auth-msg';
      msg.textContent = 'Creating account…';
      try {
        await api.signup(document.getElementById('email').value, document.getElementById('password').value);
        window.location.href = '/index.html';
      } catch (err) {
        msg.className = 'auth-msg error';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
