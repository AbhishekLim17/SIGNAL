<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set new password · Outreach</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Outreach</h1>
      <p class="subtitle">Set a new password</p>
      <form id="resetForm">
        <label>New password (min 8 characters)<input type="password" id="password" autocomplete="new-password" required /></label>
        <button type="submit" class="btn btn-primary">Update password</button>
      </form>
      <div id="msg" class="auth-msg"></div>
      <div class="auth-links">
        <a href="login.html">Back to sign in</a>
      </div>
    </div>
  </div>
  <script type="module">
    import { api } from './js/api.js';
    const msg = document.getElementById('msg');
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) {
      msg.className = 'auth-msg error';
      msg.textContent = 'Missing reset token. Use the link from your email.';
    }
    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'auth-msg';
      msg.textContent = 'Updating…';
      try {
        await api.reset(token, document.getElementById('password').value);
        msg.className = 'auth-msg success';
        msg.textContent = 'Password updated. Redirecting to sign in…';
        setTimeout(() => (window.location.href = '/login.html'), 1500);
      } catch (err) {
        msg.className = 'auth-msg error';
        msg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
